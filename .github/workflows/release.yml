name: Release Android

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true
      - name: 从 Secrets 准备签名目录
        shell: pwsh
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_CREDENTIALS_TXT: ${{ secrets.SIGNING_CREDENTIALS_TXT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEYSTORE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_CREDENTIALS_TXT)) {
            Write-Output "未配置签名 Secrets（SIGNING_KEYSTORE_BASE64 / SIGNING_CREDENTIALS_TXT），本次跳过发布构建"
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP 'signing'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          [IO.File]::WriteAllBytes(
            (Join-Path $dir 'release.keystore'),
            [Convert]::FromBase64String($env:SIGNING_KEYSTORE_BASE64))
          $credentials = $env:SIGNING_CREDENTIALS_TXT.TrimEnd() + [Environment]::NewLine
          [IO.File]::WriteAllText(
            (Join-Path $dir '签名凭据.txt'),
            $credentials,
            [Text.UTF8Encoding]::new($false))
          "SIGNING_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: 正式签名发布构建
        if: env.SIGNING_DIR != ''
        shell: pwsh
        run: pwsh -NoProfile -File Tools\Publish-Android.ps1 -SigningDirectory "$env:SIGNING_DIR"
      - uses: actions/upload-artifact@v4
        if: env.SIGNING_DIR != ''
        with:
          name: packingproof-android-release
          path: dist/android/*
          if-no-files-found: error
